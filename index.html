let cyInstance=null;function initCytoscape(){if(typeof cytoscape!=='function')return false;const svg=document.getElementById('graph');if(!svg)return false;const names=[...svg.querySelectorAll('[data-node]')].map(g=>g.dataset.node);const edges=[...svg.querySelectorAll('.edge')].map(e=>[e.dataset.from,e.dataset.to]);const host=document.createElement('div');host.id='cy-graph';host.setAttribute('role','application');host.setAttribute('aria-label','Interactive investigation network. Drag nodes, pinch to zoom, tap to highlight connections.');svg.replaceWith(host);const people=new Set(['Red','Liz','Tom','Sam','Ressler','Madeline Pratt','Floriana Campo']);const clues=new Set(['FBI','Hidden box','Black site',"Red's enemies",'Intelligence network','False identities','Criminal network','Cybercrime']);const elements=[...names.map(n=>({data:{id:n,label:n,kind:people.has(n)?'person':clues.has(n)?'clue':'case'}})),...edges.map(([a,b],i)=>({data:{id:'edge'+i,source:a,target:b}}))];const degrees={};edges.forEach(([a,b])=>{degrees[a]=(degrees[a]||0)+1;degrees[b]=(degrees[b]||0)+1});elements.filter(x=>!x.data.source).forEach(x=>x.data.degree=Math.min(10,degrees[x.data.id]||0));if(cyInstance)cyInstance.destroy();cyInstance=cytoscape({container:host,elements,layout:{name:'cose',animate:false,randomize:false,nodeRepulsion:380000,idealEdgeLength:115,edgeElasticity:85,gravity:35,numIter:500,padding:45},minZoom:.3,maxZoom:3.5,wheelSensitivity:.18,style:[{selector:'node',style:{'background-color':'#43596b','border-color':'#a9c5d7','border-width':2,'width':'mapData(degree, 0, 10, 17, 42)','height':'mapData(degree, 0, 10, 17, 42)','label':'data(label)','color':'#e8eef4','font-size':12,'text-valign':'bottom','text-margin-y':10,'text-outline-width':3,'text-outline-color':'#101824','transition-property':'opacity,background-color,border-width,width,height','transition-duration':'250ms'}},{selector:'node[kind="person"]',style:{'background-color':'#d45266'}},{selector:'node[kind="case"]',style:{'bac let graphMoved=false;function initGraphControls(){const svg=document.getElementById('graph');if(!svg)return;const ns='http://www.w3.org/2000/svg',layer=document.createElementNS(ns,'g');while(svg.firstChild)layer.appendChild(svg.firstChild);svg.appendChild(layer);let x=0,y=0,k=1;const apply=()=>layer.setAttribute('transform','translate('+x+' '+y+') scale('+k+')');function zoom(f,px=450,py=240){let nk=Math.max(.55,Math.min(4,k*f));x=px-(px-x)*nk/k;y=py-(py-y)*nk/k;k=nk;apply()}function point(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*480}}let pointers=new Map(),drag=null,lastDistance=0;svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pointers.set(e.pointerId,point(e));graphMoved=false;if(pointers.size===1){drag={p:point(e),x,y};svg.classList.add('dragging')}else if(pointers.size===2){const a=[...pointers.values()];lastDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});svg.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=point(e);pointers.set(e.pointerId,p);if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDistance>0){zoom(dist/lastDistance,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);graphMoved=true}lastDistance=dist}else if(drag&&Math.hypot(p.x-drag.p.x,p.y-drag.p.y)>4){x=drag.x+p.x-drag.p.x;y=drag.y+p.y-drag.p.y;graphMoved=true;apply()}});function end(e){pointers.delete(e.pointerId);drag=null;lastDistance=0;svg.classList.remove('dragging');setTimeout(()=>graphMoved=false,0)}svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.13:.885,p.x,p.y)},{passive:false});document.getElementById('zoom-in').onclick=()=>zoom(1.25);document.getElementById('zoom-out').onclick=()=>zoom(.8);document.getElementById('zoom-fit').onclick=()=>{x=0;y=0;k=1;apply()};document.getElementById('graph-clear').onclick=()=>selectNode(null);document.getElementById('graph-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();const matches=[...document.querySelectorAll('#graph [data-node]')].filter(g=>g.dataset.node.toLowerCase().includes(q));document.querySelectorAll('#graph [data-node]').forEach(g=>g.style.opacity=(!q||matches.includes(g))?'':'.12');if(q&&matches.length===1){selected=matches[0].dataset.node;updateSpotlight()}else if(!q){selected=null;updateSpotlight()}});apply()}
function selectNode(n){selected=selected===n?null:n;const q=document.getElementById('graph-search');if(q)q.value='';document.querySelectorAll('#graph [data-node]').forEach(g=>g.style.opacity='');updateSpotlight()}function updateSpotlight(){if(cyInstance){const cy=cyInstance;cy.batch(()=>{cy.elements().removeClass('dimmed spotlight chosen');if(selected){const node=cy.getElementById(selected);const neighborhood=node.closedNeighborhood();cy.elements().not(neighborhood).addClass('dimmed');node.addClass('chosen');node.connectedEdges().addClass('spotlight');node.neighborhood('node').addClass('spotlight')}});const d=document.getElementById('details');if(d){const related=selected?cy.getElementById(selected).neighborhood('node').map(n=>n.id()):[];d.innerHTML=selected?'<h3>'+escapeHtml(selected)+'</h3><p>'+escapeHtml(descriptions[selected]||'Person or case introduced by this episode.')+'</p><p class="muted">Direct connections ('+related.length+'): '+escapeHtml(related.join(', ')||'None charted')+'</p>':'<h3>Full network</h3><p>Tap any node to highlight its relationships. Drag nodes to rearrange the board.</p>'}return}const groups=[...document.querySelectorAll('#graph [data-node]')],edges=[...document.querySelectorAll('#graph .edge')];if(!groups.length)return;const connected=new Set(selected?[selected]:[]);edges.forEach(e=>{if(selected&&(e.dataset.from===selected||e.dataset.to===selected)){connected.add(e.dataset.from);connected.add(e.dataset.to)}});groups.forEach(g=>{const n=g.dataset.node;g.classList.toggle('is-selected',!!selected&&n===selected);g.classList.toggle('is-connected',!!selected&&n!==selected&&connected.has(n));g.classList.toggle('is-muted',!!selected&&!connected.has(n));g.querySelector('circle').classList.toggle('selected',!!selected&&n===selected);g.setAttribute('aria-pressed',String(!!selected&&n===selected))});edges.forEach(e=>{const on=!!selected&&(e.dataset.from===selected||e.dataset.to===selected);e.classList.toggle('is-connected',on);e.classList.toggle('is-muted',!!selected&&!on)});const d=document.getElementById('details');if(d){const related=edges.filter(e=>selected&&(e.dataset.from===selected||e.dataset.to===selected)).map(e=>e.dataset.from===selected?e.dataset.to:e.dataset.from);d.innerHTML=selected?'<h3>'+escapeHtml(selected)+'</h3><p>'+escapeHtml(descriptions[selected]||'Person or case introduced by this episode.')+'</p><p class="muted">Direct connections ('+related.length+'): '+escapeHtml(related.join(', ')||'None charted')+'</p>':'<h3>Full network</h3><p>Select any dot to highlight its direct relationships and dim unrelated cases.</p>'}}
