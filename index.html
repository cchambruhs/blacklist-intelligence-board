<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e17"><title>The Blacklist | Intelligence Board</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e7eef7;background:#080e17;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -15%,#172e40 0%,#080e17 60%);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #72d4e3;outline-offset:2px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:20px max(20px,calc((100vw - 1360px)/2));border-bottom:1px solid #263545;background:#0b131fe8}.brand{font-size:17px;font-weight:800;letter-spacing:.13em}.brand span{color:#73d7df}.subbrand{font-size:10px;color:#7e97a9;letter-spacing:.19em;margin-top:6px}.status{border:1px solid #2d5460;background:#122c35;color:#a4e8e9;border-radius:100px;padding:8px 13px;font-size:11px;letter-spacing:.1em}main{max-width:1360px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.eyebrow{color:#71d1d9;text-transform:uppercase;font-size:11px;letter-spacing:.2em;font-weight:700}h1{font-size:clamp(25px,3vw,38px);letter-spacing:-.035em;margin:8px 0}h2{font-size:19px;margin:0 0 14px;letter-spacing:-.025em}h3{font-size:14px;color:#9ddde0;margin:16px 0 6px}p{line-height:1.65}.muted{color:#91a4b5}.controls,.tabs,.toolbar,.graph-options,.legend,.footer{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.controls button,.tabs button,.toolbar button,.graph-options button,.footer button,select,input{border:1px solid #304558;background:#121f2e;color:#dfeaf2;padding:11px 13px;border-radius:10px}.controls button:hover,.tabs button:hover,.toolbar button:hover,.footer button:hover{border-color:#5b9baa}.t er:1px solid #283c4d;border-radius:14px;backdrop-filter:blur(14px)}button:disabled{opacity:.4;cursor:not-allowed}.progress{height:4px;background:#243a4c;border-radius:6px;overflow:hidden;margin-top:14px}.progress div{height:100%;background:linear-gradient(90deg,#3a9cae,#8ce6df)}.notice{font-size:12px;color:#819cad;margin:10px 0}.empty{padding:30px;text-align:center;color:#91a4b5}@media(max-width:850px){.graph-layout{grid-template-columns:1fr}.dossier{min-height:0}.graph-surface{height:54vh;min-height:340px}}@media(max-width:550px){main{padding:12px}header{padding:16px}.panel{padding:14px}.tabs{gap:0;overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap;font-size:12px;padding:12px 10px}.graph-options{align-items:stretch}.graph-options label{flex:1}.graph-options select{max-width:100%;width:100%;margin:5px 0}.toolbar input{flex-basis:100%}.footer button{padding:9px}.status{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}</style><script defer src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script></head><body><header><div><div class="brand">THE <span>BLACKLIST</span> <span style="color:#5b7285">/</span> INTELLIGENCE</div><div class="subbrand">CLASSIFIED INVESTIGATION NETWORK</div></div><span class="status">● SEASON ONE · ACTIVE CASEFILE</span></header><main><div class="hero"><div><div class="eyebrow">Caseboard / Season 01</div><h1 id="heading">Investigation board</h1><div id="subtitle" class="muted"></div><div class="progress"><div id="bar"></div></div></div><div class="controls"><label for="episode" class="muted">Episode</label><select id="episode"></select><button id="reset">Return to E08</button></div></div><nav class="tabs" aria-label="Views"><button data-tab="board" class="active">Neural network</button><button data-tab="brief">Episode briefing</button><button data-tab="registry">Blacklist registry</button><button data-tab="mysteries">Open mysteries</button></nav><section id="content"></section><div class="footer"><button id="prev">← Previous</button><span id="counter" class="muted"></span><button id="next">Next episode →</button></div></main><script>
'use strict';
const episodes=[
{title:'Pilot',name:'Ranko Zamani',num:52,recap:'Raymond Reddington surrenders to the FBI and demands to speak only with rookie profiler Elizabeth Keen. He helps the task force stop Ranko Zamani, whose plan involves a kidnapped general’s daughter and a bomb.',new:'Red has a mysterious interest in Liz. Liz discovers a hidden box of passports, money, and a gun beneath her floor.',big:'Red is not simply providing names: he is shaping a personal relationship with Liz, while Tom’s hidden belongings raise questions.',nodes:['Red','Liz','Tom','FBI','Zamani','Hidden box']},
{title:'The Freelancer',name:'The Freelancer',num:145,recap:'Red leads the FBI to an assassin who disguises murders as mass-casualty accidents. The task force works to protect humanitarian Floriana Campo as a supposed target.',new:'Red’s intelligence comes with ulterior motives, and the case demonstrates that his version of the truth may be incomplete.',big:'The team must constantly ask whether Red is helping them, using them, or doing both.',nodes:['Red','Liz','FBI','Freelancer','Floriana Campo']},
{title:'Wujing',name:'Wujing',num:84,recap:'Liz goes undercover in a covert operation against Wujing, who targets intelligence operatives. Red helps the team gain access to the operation.',new:'Liz sees how deeply Red operates in the world of espionage and covert identities.',big:'The case expands the board from individual criminals to international intelligence networks.',nodes:['Red','Liz','FBI','Wujing','Intelligence network']},
{title:'The Stewmaker',name:'The Stewmaker',num:161,recap:'The team pursues a criminal who disposes of bodies and destroys evidence. Liz is placed in grave danger while Red intervenes.',new:'Red reveals both his willingness to protect Liz and his capacity for brutal retaliation.',big:'Red’s personal investment in Liz becomes harder to dismiss as a professional arrangement.',nodes:['Red','Liz','FBI','Stewmaker']},
{title:'The Courier',name:'The Courier',num:85,recap:'The task force pursues a ruthless courier who transports dangerous packages and people for criminal clients.',new:'The case reveals more of the infrastructure connecting otherwise separate criminals.',big:'Red’s Blacklist is a network of services, intermediaries, and clients—not just isolated villains.',nodes:['Red','Liz','FBI','Courier','Criminal network']},
{title:'Gina Zanetakos',name:'Gina Zanetakos',num:152,recap:'An investigation into a corporate bombing plot brings Tom’s background under scrutiny, and the team encounters operative Gina Zanetakos.',new:'Evidence surrounding Tom remains troubling, but the case complicates rather than settles the question of his loyalties.',big:'Tom’s identity and Liz’s ability to trust him become central threads alongside the weekly cases.',nodes:['Red','Liz','Tom','FBI','Gina','Hidden box']},
{title:'Frederick Barnes',name:'Frederick Barnes',num:47,recap:'The team investigates a deadly biological attack and a scientist driven by a desperate personal motive.',new:'The case explores how personal grief and extreme choices can turn a scientist into a mass-casualty threat.',big:'Not every Blacklister is motivated by money or power; the human motives behind the crimes matter.',nodes:['Red','Liz','FBI','Barnes']},
{title:'General Ludd',name:'General Ludd',num:109,recap:'The task force investigates attacks targeting financial systems attributed to the anti-capitalist group General Ludd. Red also deals with a deeply personal family matter involving Sam.',new:'Sam’s relationship to Liz and Red’s involvement in her family history become more significant.',big:'The season’s central question sharpens: why is Red so invested in Liz and the secrets around her upbringing?',nodes:['Red','Liz','Tom','FBI','General Ludd','Sam']},
{title:"Anslo Garrick",name:"Anslo Garrick",num:16,recap:"A coordinated armed assault traps the task force inside the black site. The attackers seek Reddington, and the team's security is badly compromised.",new:"An enemy knows how to reach Red inside an FBI facility.",big:"Red's enemies may have access to information that should be tightly protected.",nodes:["Red","Liz","FBI","Garrick","Black site"]},
{title:"Anslo Garrick: Conclusion",name:"Anslo Garrick",num:16,recap:"The siege reaches its climax as Red and the task force struggle to survive. The aftermath raises urgent questions about who orchestrated the attack.",new:"The threat against Red extends beyond the immediate gunmen.",big:"The assault changes how the team must think about surveillance, protection, and Red's adversaries.",nodes:["Red","Liz","FBI","Garrick","Black site","Red's enemies"]},
{title:"The Good Samaritan",name:"The Good Samaritan",num:106,recap:"The team investigates a killer whose victims are connected by histories of abuse. Liz and Red continue to deal with the consequences of the black-site attack.",new:"A pattern of vigilante-style punishment complicates the investigation.",big:"The episode contrasts criminal justice with personal revenge while the broader threat to Red persists.",nodes:["Red","Liz","FBI","Good Samaritan","Red's enemies"]},
{title:"The Alchemist",name:"The Alchemist",num:101,recap:"A criminal specialist helps clients disappear by manipulating identities and forensic evidence. The task force investigates deaths that are not what they initially seem.",new:"Identity can be deliberately falsified through elaborate forensic deception.",big:"The case reinforces how unreliable appearances and official records can be.",nodes:["Red","Liz","FBI","Alchemist","False identities"]},
{title:"The Cyprus Agency",name:"The Cyprus Agency",num:64,recap:"The FBI investigates an adoption agency linked to disturbing crimes. Liz and Tom's plans for a family intersect with the case's themes.",new:"The agency conceals exploitation behind a legitimate-looking service.",big:"Liz's personal hopes and her work repeatedly collide.",nodes:["Red","Liz","FBI","Cyprus Agency","Tom"]},
{title:"Madeline Pratt",name:"Madeline Pratt",num:73,recap:"Red reunites with a skilled con artist and former associate while pursuing valuable intelligence. Liz is drawn into a deception-heavy operation.",new:"Red's past relationships can be both useful and dangerous.",big:"His history contains unresolved betrayals that affect present alliances.",nodes:["Red","Liz","FBI","Madeline Pratt","Red"]},
{title:"The Judge",name:"The Judge",num:57,recap:"A clandestine figure imposes punishment on people believed responsible for wrongful convictions. The task force follows the trail of disappearances.",new:"A secret system of extrajudicial judgment has been operating outside the courts.",big:"The case questions who gets to decide what justice looks like.",nodes:["Red","Liz","FBI","Judge","FBI"]},
{title:"Mako Tanida",name:"Mako Tanida",num:83,recap:"A fugitive crime boss pursues revenge against former FBI agents. Ressler's personal history becomes central to the investigation.",new:"Ressler has unresolved trauma tied to a past operation.",big:"The people investigating the Blacklist also have vulnerabilities and histories.",nodes:["Red","Liz","FBI","Mako Tanida","Ressler"]},
{title:"Ivan",name:"Ivan",num:88,recap:"A cybercrime investigation involving stolen technology leads the team through deception and mistaken assumptions about a hacker's identity.",new:"The apparent perpetrator and actual motive are not as straightforward as they first appear.",big:"Digital evidence can be manipulated just as physical evidence can.",nodes:["Red","Liz","FBI","Ivan","Cybercrime"]},
{title:"Milton Bobbit",name:"Milton Bobbit",num:135,recap:"The task force investigates a broker who recruits terminally ill people for deadly assignments. The crimes lead toward a larger financial motive.",new:"The attacks are part of an organized service rather than isolated acts.",big:"A hidden employer or beneficiary can be more important than the person committing the crime.",nodes:["Red","Liz","FBI","Milton Bobbit","Criminal network"]},
{title:"The Pavlovich Brothers",name:"Pavlovich Brothers",num:null,recap:"The task force confronts a team of specialist abductors as a separate personal investigation intensifies. Liz's questions about Tom become harder to ignore.",new:"The brothers' operation and Liz's search for answers intersect.",big:"Private loyalties and professional missions increasingly overlap.",nodes:["Red","Liz","FBI","Pavlovich Brothers","Tom","Liz"]},
{title:"The Kingmaker",name:"The Kingmaker",num:42,recap:"The FBI investigates a political fixer who manipulates public events to elevate his clients. Red's concern about a dangerous opponent becomes more urgent.",new:"Political influence can be manufactured through staged crises.",big:"Red's larger conflict reaches into institutions beyond the criminal underworld.",nodes:["Red","Liz","FBI","Kingmaker","Red's enemies"]},
{title:"Berlin",name:"Berlin",num:8,recap:"An escalating threat linked to a mysterious adversary puts Red and the task force under pressure. Events point toward a coordinated campaign against him.",new:"A powerful opponent is becoming the center of the season's larger conflict.",big:"Earlier warnings and attacks begin to form a more connected pattern.",nodes:["Red","Liz","FBI","Berlin","Red's enemies"]},
{title:"Berlin: Conclusion",name:"Berlin",num:8,recap:"The season finale brings the pursuit of Red's adversary into sharp focus amid major danger for the task force. Several personal and operational questions remain unsettled.",new:"The conflict around Red is larger and more personal than the weekly cases suggested.",big:"The season closes by connecting Red's enemies, his history, and the task force's future.",nodes:["Red","Liz","FBI","Berlin","Red's enemies","Tom"]}
];
const descriptions={'Garrick':'Armed attacker targeting Red and the task force.','Black site':'The task force’s secure operational facility.','Red\'s enemies':'Adversaries targeting Red and his associates.','Good Samaritan':'Vigilante killer associated with a pattern of punishment.','Alchemist':'Specialist in forensic identity manipulation.','False identities':'Records and physical evidence that may conceal the truth.','Cyprus Agency':'Adoption organization investigated by the task force.','Madeline Pratt':'Con artist and associate from Red’s past.','Judge':'Clandestine arbiter of extrajudicial punishment.','Mako Tanida':'Crime boss with a revenge agenda.','Ressler':'Donald Ressler, FBI agent with a complicated past.','Ivan':'Name associated with a cybercrime investigation.','Cybercrime':'Computer intrusion and stolen technical information.','Milton Bobbit':'Broker recruiting people for deadly assignments.','Pavlovich Brothers':'Specialist abduction team.','Kingmaker':'Political fixer who manufactures crises.','Berlin':'Name associated with Red’s powerful adversary.','Red':'Raymond Reddington · FBI informant and wanted criminal. His motives remain uncertain.','Liz':'Elizabeth Keen · FBI profiler. Red insists on working with her.','Tom':'Tom Keen · Liz’s husband. His hidden possessions raise unanswered questions.','FBI':'FBI task force · Investigates criminals using Red’s information.','Hidden box':'Passports, cash and a gun discovered in Liz and Tom’s home. Their meaning is unresolved.','Sam':'Sam · Liz’s adoptive father, with a connection to Red.','Zamani':'Ranko Zamani · First case brought by Red.','Freelancer':'Assassin whose murders are disguised as accidents.','Floriana Campo':'Humanitarian figure central to the second investigation.','Wujing':'Operative targeting intelligence assets.','Intelligence network':'Covert information and intelligence operations.','Stewmaker':'Criminal who eliminates bodies and physical evidence.','Courier':'Criminal intermediary transporting illicit cargo.','Criminal network':'Interconnected underworld infrastructure.','Gina':'Gina Zanetakos · Operative linked to the investigation of Tom.','Barnes':'Frederick Barnes · Scientist connected to a biological attack.','General Ludd':'Anti-capitalist group connected to attacks on financial systems.'};
const links=[['Red','Liz'],['Red','FBI'],['Liz','Tom'],['Liz','FBI'],['Red','Zamani'],['Tom','Hidden box'],['Red','Freelancer'],['Freelancer','Floriana Campo'],['Red','Wujing'],['Wujing','Intelligence network'],['Red','Stewmaker'],['Red','Courier'],['Courier','Criminal network'],['Tom','Gina'],['Liz','Gina'],['Red','Barnes'],['Red','General Ludd'],['Red','Sam'],['Sam','Liz'],['Red','Garrick'],['Garrick','Black site'],['Garrick',"Red's enemies"],['Red',"Red's enemies"],['Red','Berlin'],['Berlin',"Red's enemies"],['Liz','Pavlovich Brothers'],['Tom','Pavlovich Brothers'],['Ressler','Mako Tanida'],['Red','Madeline Pratt'],['Red','Kingmaker']];

const $=id=>document.getElementById(id);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getNumber=(key,fallback)=>{try{const v=Number(localStorage.getItem(key));return Number.isFinite(v)&&v>0?v:fallback}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,String(value))}catch{}};
let unlocked=Math.min(22,Math.max(8,getNumber('blacklist-unlocked',8)));
let ep=Math.min(unlocked,Math.max(1,getNumber('blacklist-episode',8)));
let tab='board',selected=null,cy=null,graphNodes=[],graphEdges=[];
const people=new Set(['Red','Liz','Tom','Sam','Ressler','Madeline Pratt','Floriana Campo']);
const clues=new Set(['FBI','Hidden box','Black site',"Red's enemies",'Intelligence network','False identities','Criminal network','Cybercrime']);
function kind(n){return people.has(n)?'person':clues.has(n)?'clue':'case'}
function available(){graphNodes=[...new Set(episodes.slice(0,ep).flatMap(x=>x.nodes))];graphEdges=links.filter(([a,b])=>graphNodes.includes(a)&&graphNodes.includes(b))}
function render(){const e=episodes[ep-1];$('heading').textContent='S01E'+String(ep).padStart(2,'0')+' / '+e.title;$('subtitle').textContent='Season 1 · Episode '+ep+' of 22 · Unlocked through episode '+unlocked;$('bar').style.width=(ep/22*100)+'%';$('episode').value=String(ep);$('prev').disabled=ep<=1;$('next').disabled=ep>=22;$('counter').textContent=ep+' / 22';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(cy){cy.destroy();cy=null}const content=$('content');if(tab==='board'){available();if(selected&&!graphNodes.includes(selected))selected=null;content.innerHTML='<div class="graph-layout"><div class="panel graph-main"><h2>Relationship intelligence</h2><p class="muted">Explore the evidence. Select a node to isolate its direct connections; drag to reposition, pinch to zoom.</p><div class="toolbar"><input id="graph-search" type="search" placeholder="Search people, cases, clues…" aria-label="Search graph"><button id="zoom-in" title="Zoom in">+</button><button id="zoom-out" title="Zoom out">−</button><button id="zoom-fit">Fit</button><button id="graph-clear">Clear</button></div><div class="graph-options"><label>Scope <select id="graph-view"><option value="all">Global graph</option><option value="1">1 connection</option><option value="2">2 connections</option><option value="3">3 connections</option></select></label><label>Show <select id="graph-category"><option value="all">All categories</option><option value="person">People</option><option value="case">Cases</option><option value="clue">Clues</option></select></label><button id="graph-relayout">Rearrange</button></div><div id="graph" class="graph-surface" aria-label="Interactive relationship network"></div><div class="legend"><span><i style="background:#d86e7c"></i>People</span><span><i style="background:#e5b46c"></i>Cases</span><span><i style="background:#6fc6d8"></i>Clues</span></div><div class="notice">Only relationships revealed through the selected episode are displayed.</div></div><aside class="panel dossier" id="details"></aside></div>';initGraph()}else if(tab==='brief'){content.innerHTML='<div class="panel"><div class="eyebrow">Episode briefing</div><h2>'+escapeHtml(e.title)+'</h2><h3>Recap</h3><p>'+escapeHtml(e.recap)+'</p><h3>New intelligence</h3><p>'+escapeHtml(e.new)+'</p><h3>Connection to the larger mystery</h3><p>'+escapeHtml(e.big)+'</p><p class="notice">Concise summaries; no information beyond this episode.</p></div>'}else if(tab==='registry'){const cases=episodes.slice(0,ep).filter((x,i)=>i===0||x.name!==episodes[i-1].name);content.innerHTML='<div class="panel"><h2>Blacklist registry · '+cases.length+' casefiles</h2><div class="grid">'+cases.map(x=>'<article class="case"><span class="tag">NO. '+(x.num??'UNASSIGNED')+' · S01E'+String(episodes.indexOf(x)+1).padStart(2,'0')+'</span><strong>'+escapeHtml(x.name)+'</strong><p class="muted">'+escapeHtml(x.new)+'</p></article>').join('')+'</div></div>'}else{const mysteries=[['Why is Red personally invested in Liz?','Introduced in the pilot'],['What is Tom hiding?','The hidden box raises questions'],['What happened in Liz’s childhood?','Red and Sam have an unexplained connection']];if(ep>=9)mysteries.push(['Who is coordinating attacks against Red?','Black-site assault']);if(ep>=21)mysteries.push(['Who is Berlin?','Season finale arc']);content.innerHTML='<div class="panel"><h2>Unresolved investigations</h2><div class="grid">'+mysteries.map(m=>'<article class="case"><strong>'+escapeHtml(m[0])+'</strong><span class="tag">'+escapeHtml(m[1])+'</span></article>').join('')+'</div></div>'}save('blacklist-episode',ep)}
function neighbors(n){return graphEdges.filter(([a,b])=>a===n||b===n).map(([a,b])=>a===n?b:a)}
function dossier(){const d=$('details');if(!d)return;if(!selected){d.innerHTML='<div class="kicker">Network overview</div><h2>Explore the connections</h2><p class="muted">Select any dot to open its dossier and spotlight its immediate relationships.</p><p class="muted">'+graphNodes.length+' entities · '+graphEdges.length+' documented connections</p>';return}const ns=neighbors(selected);d.innerHTML='<div class="kicker">'+escapeHtml(kind(selected))+' / dossier</div><h2>'+escapeHtml(selected)+'</h2><p>'+escapeHtml(descriptions[selected]||'Person, case, or clue introduced by this point in the investigation.')+'</p><h3>Direct connections · '+ns.length+'</h3><div>'+ns.map(n=>'<button class="link-chip" data-related="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>').join('')+'</div>';d.querySelectorAll('[data-related]').forEach(b=>b.onclick=()=>selectNode(b.dataset.related))}
function selectNode(n){selected=selected===n?null:n;applyFilters();dossier()}
function applyFilters(){if(!cy)return;const scope=$('graph-view').value,category=$('graph-category').value,q=$('graph-search').value.trim().toLowerCase();const allowed=new Set();if(scope==='all'||!selected)graphNodes.forEach(n=>allowed.add(n));else{let frontier=new Set([selected]);allowed.add(selected);for(let i=0;i<Number(scope);i++){const next=new Set();for(const n of frontier)for(const v of neighbors(n)){allowed.add(v);next.add(v)}frontier=next}}cy.batch(()=>{cy.elements().removeClass('dim chosen linked');cy.nodes().forEach(n=>{const id=n.id(),visible=allowed.has(id)&&(category==='all'||kind(id)===category||id===selected);n.style('display',visible?'element':'none')});cy.edges().forEach(e=>e.style('display',e.source().style('display')==='none'||e.target().style('display')==='none'?'none':'element'));if(selected){const focus=cy.getElementById(selected);cy.elements().addClass('dim');focus.removeClass('dim').addClass('chosen');focus.connectedEdges(':visible').removeClass('dim').addClass('linked');focus.neighborhood('node:visible').removeClass('dim').addClass('linked')}if(q){cy.nodes(':visible').forEach(n=>{if(!n.id().toLowerCase().includes(q))n.addClass('dim');else n.removeClass('dim').addClass('linked')})}})}
function initGraph(){dossier();const host=$('graph');if(typeof window.cytoscape!=='function'){host.innerHTML='<div class="graph-fallback"><p class="muted">Interactive graph engine unavailable. You can still browse all case connections below.</p><div class="fallback-nodes">'+graphNodes.map(n=>'<button data-fallback="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>').join('')+'</div></div>';host.querySelectorAll('[data-fallback]').forEach(b=>b.onclick=()=>selectNode(b.dataset.fallback));$('graph-search').oninput=e=>host.querySelectorAll('[data-fallback]').forEach(b=>b.hidden=!b.dataset.fallback.toLowerCase().includes(e.target.value.toLowerCase()));return}const degree={};graphEdges.forEach(([a,b])=>{degree[a]=(degree[a]||0)+1;degree[b]=(degree[b]||0)+1});const elements=[...graphNodes.map(n=>({data:{id:n,label:n,kind:kind(n),size:Math.min(53,20+(degree[n]||0)*3)}})),...graphEdges.map(([a,b],i)=>({data:{id:'edge-'+i,source:a,target:b}}))];try{cy=window.cytoscape({container:host,elements,layout:{name:'cose',animate:false,randomize:false,nodeRepulsion:300000,idealEdgeLength:115,gravity:40,numIter:450,padding:42},minZoom:.25,maxZoom:4,wheelSensitivity:.2,style:[{selector:'node',style:{'background-color':'#6fc6d8','width':'data(size)','height':'data(size)','label':'data(label)','color':'#d8eaf3','font-size':11,'text-valign':'bottom','text-margin-y':9,'text-outline-color':'#101b29','text-outline-width':3,'border-width':1,'border-color':'#7faab9','transition-property':'opacity,border-width,border-color','transition-duration':'220ms'}},{selector:'node[kind="person"]',style:{'background-color':'#d86e7c'}},{selector:'node[kind="case"]',style:{'background-color':'#e5b46c'}},{selector:'edge',style:{'line-color':'#45677a','width':1.6,'opacity':.62,'curve-style':'bezier','transition-property':'opacity,line-color,width','transition-duration':'220ms'}},{selector:'.dim',style:{'opacity':.12}},{selector:'node.chosen',style:{'border-color':'#ffffff','border-width':5,'opacity':1}},{selector:'node.linked',style:{'border-color':'#b1f6fa','border-width':3,'opacity':1}},{selector:'edge.linked',style:{'line-color':'#78dce4','width':3.4,'opacity':1}}]});cy.on('tap','node',e=>selectNode(e.target.id()));cy.on('tap',e=>{if(e.target===cy)selectNode(null)});cy.on('mouseover','node',e=>{if(!selected){cy.elements().addClass('dim');e.target.closedNeighborhood().removeClass('dim')}});cy.on('mouseout','node',()=>{if(!selected)applyFilters()});$('zoom-in').onclick=()=>cy.zoom({level:Math.min(4,cy.zoom()*1.25),renderedPosition:{x:host.clientWidth/2,y:host.clientHeight/2}});$('zoom-out').onclick=()=>cy.zoom({level:Math.max(.25,cy.zoom()*.8),renderedPosition:{x:host.clientWidth/2,y:host.clientHeight/2}});$('zoom-fit').onclick=()=>cy.animate({fit:{eles:cy.elements(':visible'),padding:30},duration:250});$('graph-clear').onclick=()=>{selected=null;$('graph-search').value='';$('graph-view').value='all';$('graph-category').value='all';applyFilters();dossier()};$('graph-search').oninput=applyFilters;$('graph-view').onchange=applyFilters;$('graph-category').onchange=applyFilters;$('graph-relayout').onclick=()=>cy.layout({name:'cose',animate:false,randomize:false,nodeRepulsion:300000,idealEdgeLength:115,numIter:350,padding:42}).run();applyFilters()}catch(error){if(cy){try{cy.destroy()}catch{}cy=null}host.innerHTML='<div class="empty">Graph engine encountered an error. Reload to try again.</div>';console.error(error)}}
function navigate(target){if(target<1||target>22)return;if(target>unlocked){if(target!==unlocked+1||!confirm('Have you finished Episode '+target+'? Unlocking reveals its storyline and connections.')){$('episode').value=String(ep);return}unlocked=target;save('blacklist-unlocked',unlocked);$('episode').options[target-1].textContent='Episode '+target+' · '+episodes[target-1].title}ep=target;selected=null;render()}
for(let i=1;i<=22;i++){const o=document.createElement('option');o.value=String(i);o.textContent='Episode '+i+(i<=unlocked?' · '+episodes[i-1].title:' · Locked');$('episode').append(o)}
$('episode').onchange=e=>navigate(Number(e.target.value));$('prev').onclick=()=>navigate(ep-1);$('next').onclick=()=>navigate(ep+1);$('reset').onclick=()=>navigate(8);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected=null;render()});render();
</script></body></html>
