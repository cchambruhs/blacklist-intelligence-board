tric-grid{grid-template-columns:repeat(2,1fr)}.overview-grid{grid-template-columns:1fr}}@media(max-width:550px){.command-banner{padding:23px}.command-banner:after{display:none}.metric{padding:14px}.metric strong{font-size:28px}.cast-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cast-photo{height:175px}.cast-body{padding:11px}.cast-body h3{font-size:14px}.cast-body button{padding:8px}} .kill-summary{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}.kill-summary h2{margin:8px 0}.kill-summary p{margin:0}.kill-rows{display:grid;gap:8px;margin:14px 0}.kill-row{display:flex;justify-content:space-between;border-bottom:1px solid #294153;padding:12px 4px}.kill-row strong{color:#7ce1e5}.kill-form{display:grid;gap:12px}.kill-form label{display:grid;gap:6px;font-size:12px;color:#9db3c2}.kill-form input,.kill-form select{width:100%}.kill-form button{border:0;border-radius:10px;padding:12px;background:#78d8df;color:#0a1c24;font-weight:800}.kill-events{max-height:390px;overflow:auto}.kill-event{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #2b4254;padding:10px 0}.kill-event strong{font-size:12px}.kill-event p{font-size:12px;margin:4px 0}.kill-event button{background:transparent;border:1px solid #704b56;color:#f1b7c0;padding:6px;border-radius:8px;font-size:11px}.kill-badge{display:inline-flex;vertical-align:middle;align-items:center;white-space:nowrap;background:#41252c;border:1px solid #92515a;color:#ffb5b5;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.01em;margin-left:4px}.dossier .kill-badge{font-size:13px}.cast-card .kill-badge{margin-top:5px}</style></head><body><header><div><div class="brand">THE <span>BLACKLIST</span> <span style="color:#5b7285">/</span> INTELLIGENCE</div><div class="subbrand">CLASSIFIED INVESTIGATION NETWORK</div></div><span class="status">● SEASON ONE · ACTIVE CASEFILE</span></header><main><div class="hero"><div><div class="eyebrow">Caseboard / Season 01</div><h1 id="heading">Investigation board</h1><div id="subtitle" class="muted"></div><div class="progress"><div id="bar"></div></div></div><div class="controls"><label for="episode" class="muted">Episode</label><select id="episode"></select><button id="reset">Return to E08</button></div></div><nav class="tabs" aria-label="Views"><button data-tab="overview" class="active">Command center</button><button data-tab="board">Neural network</button><button data-tab="cast">Character files</button><button data-tab="kills">Kill ledger</button><button data-tab="brief">Episode briefing</button><button data-tab="registry">Blacklist registry</button><button data-tab="mysteries">Open mysteries</button></nav><section id="content"></section><div class="footer"><button id="prev">← Previous</button><span id="counter" class="muted"></span><button id="next">Next episode →</button></div></main><script>
'use strict';
const episodes=[
{title:'Pilot',name:'Ranko Zamani',num:52,recap:'Raymond Reddington surrenders to the FBI and demands to speak only with rookie profiler Elizabeth Keen. He helps the task force stop Ranko Zamani, whose plan involves a kidnapped general’s daughter and a bomb.',new:'Red has a mysterious interest in Liz. Liz discovers a hidden box of passports, money, and a gun beneath her floor.',big:'Red is not simply providing names: he is shaping a personal relationship with Liz, while Tom’s hidden belongings raise questions.',nodes:['Red','Liz','Tom','FBI','Zamani','Hidden box']},
{title:'The Freelancer',name:'The Freelancer',num:145,recap:'Red leads the FBI to an assassin who disguises murders as mass-casualty accidents. The task force works to protect humanitarian Floriana Campo as a supposed target.',new:'Red’s intelligence comes with ulterior motives, and the case demonstrates that his version of the truth may be incomplete.',big:'The team must constantly ask whether Red is helping them, using them, or doing both.',nodes:['Red','Liz','FBI','Freelancer','Floriana Campo']},
{title:'Wujing',name:'Wujing',num:84,recap:'Liz goes undercover in a covert operation against Wujing, who targets intelligence operatives. Red helps the team gain access to the operation.',new:'Liz sees how deeply Red operates in the world of espionage and covert identities.',big:'The case expands the board from individual criminals to international intelligence networks.',nodes:['Red','Liz','FBI','Wujing','Intelligence network']},
{title:'The Stewmaker',name:'The Stewmaker',num:161,recap:'The team pursues a criminal who disposes of bodies and destroys evidence. Liz is placed in grave danger while Red intervenes.',new:'Red reveals both his willingness to protect Liz and his capacity for brutal retaliation.',big:'Red’s personal investment in Liz becomes harder to dismiss as a professional arrangement.',nodes:['Red','Liz','FBI','Stewmaker']},
{title:'The Courier',name:'The Courier',num:85,recap:'The task force pursues a ruthless courier who transports dangerous packages and people for criminal clients.',new:'The case reveals more of the infrastructure connecting otherwise separate criminals.',big:'Red’s Blacklist is a network of services, intermediaries, and clients—not just isolated villains.',nodes:['Red','Liz','FBI','Courier','Criminal network']},
{title:'Gina Zanetakos',name:'Gina Zanetakos',num:152,recap:'An investigation into a corporate bombing plot brings Tom’s background under scrutiny, and the team encounters operative Gina Zanetakos.',new:'Evidence surrounding Tom remains troubling, but the case complicates rather than settles the question of his loyalties.',big:'Tom’s identity and Liz’s ability to trust him become central threads alongside the weekly cases.',nodes:['Red','Liz','Tom','FBI','Gina','Hidden box']},
{title:'Frederick Barnes',name:'Frederick Barnes',num:47,recap:'The team investigates a deadly biological attack and a scientist driven by a desperate personal motive.',new:'The case explores how personal grief and extreme choices can turn a scientist into a mass-casualty threat.',big:'Not every Blacklister is motivated by money or power; the human motives behind the crimes matter.',nodes:['Red','Liz','FBI','Barnes']},
{title:'General Ludd',name:'General Ludd',num:109,recap:'The task force investigates attacks targeting financial systems attributed to the anti-capitalist group General Ludd. Red also deals with a deeply personal family matter involving Sam.',new:'Sam’s relationship to Liz and Red’s involvement in her family history become more significant.',big:'The season’s central question sharpens: why is Red so invested in Liz and the secrets around her upbringing?',nodes:['Red','Liz','Tom','FBI','General Ludd','Sam']},
{title:"Anslo Garrick",name:"Anslo Garrick",num:16,recap:"A coordinated armed assault traps the task force inside the black site. The attackers seek Reddington, and the team's security is badly compromised.",new:"An enemy knows how to reach Red inside an FBI facility.",big:"Red's enemies may have access to information that should be tightly protected.",nodes:["Red","Liz","FBI","Garrick","Black site"]},
{title:"Anslo Garrick: Conclusion",name:"Anslo Garrick",num:16,recap:"The siege reaches its climax as Red and the task force struggle to survive. The aftermath raises urgent questions about who orchestrated the attack.",new:"The threat against Red extends beyond the immediate gunmen.",big:"The assault changes how the team must think about surveillance, protection, and Red's adversaries.",nodes:["Red","Liz","FBI","Garrick","Black site","Red's enemies"]},
{title:"The Good Samaritan",name:"The Good Samaritan",num:106,recap:"The team investigates a killer whose victims are connected by histories of abuse. Liz and Red continue to deal with the consequences of the black-site attack.",new:"A pattern of vigilante-style punishment complicates the investigation.",big:"The episode contrasts criminal justice with personal revenge while the broader threat to Red persists.",nodes:["Red","Liz","FBI","Good Samaritan","Red's enemies"]},
{title:"The Alchemist",name:"The Alchemist",num:101,recap:"A criminal specialist helps clients disappear by manipulating identities and forensic evidence. The task force investigates deaths that are not what they initially seem.",new:"Identity can be deliberately falsified through elaborate forensic deception.",big:"The case reinforces how unreliable appearances and official records can be.",nodes:["Red","Liz","FBI","Alchemist","False identities"]},
{title:"The Cyprus Agency",name:"The Cyprus Agency",num:64,recap:"The FBI investigates an adoption agency linked to disturbing crimes. Liz and Tom's plans for a family intersect with the case's themes.",new:"The agency conceals exploitation behind a legitimate-looking service.",big:"Liz's personal hopes and her work repeatedly collide.",nodes:["Red","Liz","FBI","Cyprus Agency","Tom"]},
{title:"Madeline Pratt",name:"Madeline Pratt",num:73,recap:"Red reunites with a skilled con artist and former associate while pursuing valuable intelligence. Liz is drawn into a deception-heavy operation.",new:"Red's past relationships can be both useful and dangerous.",big:"His history contains unresolved betrayals that affect present alliances.",nodes:["Red","Liz","FBI","Madeline Pratt","Red"]},
{title:"The Judge",name:"The Judge",num:57,recap:"A clandestine figure imposes punishment on people believed responsible for wrongful convictions. The task force follows the trail of disappearances.",new:"A secret system of extrajudicial judgment has been operating outside the courts.",big:"The case questions who gets to decide what justice looks like.",nodes:["Red","Liz","FBI","Judge","FBI"]},
{title:"Mako Tanida",name:"Mako Tanida",num:83,recap:"A fugitive crime boss pursues revenge against former FBI agents. Ressler's personal history becomes central to the investigation.",new:"Ressler has unresolved trauma tied to a past operation.",big:"The people investigating the Blacklist also have vulnerabilities and histories.",nodes:["Red","Liz","FBI","Mako Tanida","Ressler"]},
{title:"Ivan",name:"Ivan",num:88,recap:"A cybercrime investigation involving stolen technology leads the team through deception and mistaken assumptions about a hacker's identity.",new:"The apparent perpetrator and actual motive are not as straightforward as they first appear.",big:"Digital evidence can be manipulated just as physical evidence can.",nodes:["Red","Liz","FBI","Ivan","Cybercrime"]},
{title:"Milton Bobbit",name:"Milton Bobbit",num:135,recap:"The task force investigates a broker who recruits terminally ill people for deadly assignments. The crimes lead toward a larger financial motive.",new:"The attacks are part of an organized service rather than isolated acts.",big:"A hidden employer or beneficiary can be more important than the person committing the crime.",nodes:["Red","Liz","FBI","Milton Bobbit","Criminal network"]},
{title:"The Pavlovich Brothers",name:"Pavlovich Brothers",num:null,recap:"The task force confronts a team of specialist abductors as a separate personal investigation intensifies. Liz's questions about Tom become harder to ignore.",new:"The brothers' operation and Liz's search for answers intersect.",big:"Private loyalties and professional missions increasingly overlap.",nodes:["Red","Liz","FBI","Pavlovich Brothers","Tom","Liz"]},
{title:"The Kingmaker",name:"The Kingmaker",num:42,recap:"The FBI investigates a political fixer who manipulates public events to elevate his clients. Red's concern about a dangerous opponent becomes more urgent.",new:"Political influence can be manufactured through staged crises.",big:"Red's larger conflict reaches into institutions beyond the criminal underworld.",nodes:["Red","Liz","FBI","Kingmaker","Red's enemies"]},
{title:"Berlin",name:"Berlin",num:8,recap:"An escalating threat linked to a mysterious adversary puts Red and the task force under pressure. Events point toward a coordinated campaign against him.",new:"A powerful opponent is becoming the center of the season's larger conflict.",big:"Earlier warnings and attacks begin to form a more connected pattern.",nodes:["Red","Liz","FBI","Berlin","Red's enemies"]},
{title:"Berlin: Conclusion",name:"Berlin",num:8,recap:"The season finale brings the pursuit of Red's adversary into sharp focus amid major danger for the task force. Several personal and operational questions remain unsettled.",new:"The conflict around Red is larger and more personal than the weekly cases suggested.",big:"The season closes by connecting Red's enemies, his history, and the task force's future.",nodes:["Red","Liz","FBI","Berlin","Red's enemies","Tom"]}
];
const descriptions={'Garrick':'Armed attacker targeting Red and the task force.','Black site':'The task force’s secure operational facility.','Red\'s enemies':'Adversaries targeting Red and his associates.','Good Samaritan':'Vigilante killer associated with a pattern of punishment.','Alchemist':'Specialist in forensic identity manipulation.','False identities':'Records and physical evidence that may conceal the truth.','Cyprus Agency':'Adoption organization investigated by the task force.','Madeline Pratt':'Con artist and associate from Red’s past.','Judge':'Clandestine arbiter of extrajudicial punishment.','Mako Tanida':'Crime boss with a revenge agenda.','Ressler':'Donald Ressler, FBI agent with a complicated past.','Ivan':'Name associated with a cybercrime investigation.','Cybercrime':'Computer intrusion and stolen technical information.','Milton Bobbit':'Broker recruiting people for deadly assignments.','Pavlovich Brothers':'Specialist abduction team.','Kingmaker':'Political fixer who manufactures crises.','Berlin':'Name associated with Red’s powerful adversary.','Red':'Raymond Reddington · FBI informant and wanted criminal. His motives remain uncertain.','Liz':'Elizabeth Keen · FBI profiler. Red insists on working with her.','Tom':'Tom Keen · Liz’s husband. His hidden possessions raise unanswered questions.','FBI':'FBI task force · Investigates criminals using Red’s information.','Hidden box':'Passports, cash and a gun discovered in Liz and Tom’s home. Their meaning is unresolved.','Sam':'Sam · Liz’s adoptive father, with a connection to Red.','Zamani':'Ranko Zamani · First case brought by Red.','Freelancer':'Assassin whose murders are disguised as accidents.','Floriana Campo':'Humanitarian figure central to the second investigation.','Wujing':'Operative targeting intelligence assets.','Intelligence network':'Covert information and intelligence operations.','Stewmaker':'Criminal who eliminates bodies and physical evidence.','Courier':'Criminal intermediary transporting illicit cargo.','Criminal network':'Interconnected underworld infrastructure.','Gina':'Gina Zanetakos · Operative linked to the investigation of Tom.','Barnes':'Frederick Barnes · Scientist connected to a biological attack.','General Ludd':'Anti-capitalist group connected to attacks on financial systems.'};

const getNumber=(key,fallback)=>{try{const v=Number(localStorage.getItem(key));return Number.isFinite(v)&&v>0?v:fallback}catch{return fallback}};

node]')].find(x=>x.dataset.node===n);if(g){const c=g.querySelector('circle'),t=g.querySelector('text');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);t.setAttribute('x',p.x);t.setAttribute('y',p.y+Number(c.getAttribute('r'))+15)}host.querySelectorAll('[data-edge]').forEach(el=>{if(el.dataset.a===n){el.setAttribute('x1',p.x);el.setAttribute('y1',p.y)}if(el.dataset.b===n){el.setAttribute('x2',p.x);el.setAttribute('y2',p.y)}})}let active=new Map(),pinch=0;svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);const p=point(e);active.set(e.pointerId,p);svgMoved=false;const g=e.target.closest('[data-node]');svgDragging={node:g?g.dataset.node:null,point:p,x:svgView.x,y:svgView.y,position:g?{...svgNodes[g.dataset.node]}:null};if(active.size>1)pinch=0});svg.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;const p=point(e);active.set(e.pointerId,p);if(active.size===2){const a=[...active.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)zoom(dist/pinch,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);pinch=dist;svgMoved=true;return}if(!svgDragging)return;const dx=p.x-svgDragging.point.x,dy=p.y-svgDragging.point.y;if(Math.hypot(dx,dy)<4&&!svgMoved)return;svgMoved=true;if(svgDragging.node){const n=svgDragging.node;svgNodes[n]={x:svgDragging.position.x+dx/svgView.k,y:svgDragging.position.y+dy/svgView.k};reposition(n)}else{svgView.x=svgDragging.x+dx;svgView.y=svgDragging.y+dy;transform()}});function release(e){if(!active.has(e.pointerId))return;active.delete(e.pointerId);if(!svgMoved&&svgDragging&&svgDragging.node)selectNode(svgDragging.node);else if(!svgMoved&&!svgDragging?.node)selectNode(null);svgDragging=null;pinch=0}svg.addEventListener('pointerup',release);svg.addEventListener('pointercancel',e=>{active.delete(e.pointerId);svgDragging=null;pinch=0});svg.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.15:.87,p.x,p.y)},{passive:false});host.querySelectorAll('[data-node]').forEach(g=>g.addEventList
